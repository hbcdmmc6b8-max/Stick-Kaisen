<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07080b">
<title>STICK KAISEN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game">
<header>
  <div class="fighter">
    <b>PLAYER</b>
    <div class="hp"><i id="pHP"></i></div>
    <span id="charName">VESSEL</span>
  </div>
  <div id="title">STICK <em>KAISEN</em><small id="modeLabel">TRAINING</small></div>
  <div class="fighter right">
    <b>CPU</b>
    <div class="hp"><i id="eHP"></i></div>
    <span>TRAINING CURSE</span>
  </div>
</header>

<main>
  <canvas id="c"></canvas>
  <div id="impact"></div>
  <div id="cinema"><b id="cinemaTop">DOMAIN EXPANSION</b><strong id="cinemaName"></strong><small id="cinemaSub"></small></div>
  <div id="moveToast"></div>
</main>

<footer>
  <div class="meter">
    <label>CURSED ENERGY <span id="ceText">100</span></label>
    <div><i id="ce"></i></div>
  </div>
  <div class="meter awakening">
    <label>AWAKENING <span id="awText">0%</span></label>
    <div><i id="aw"></i></div>
  </div>
</footer>

<div id="mobile">
  <div class="move">
    <button data-hold="left">◀</button>
    <button data-action="jump">▲</button>
    <button data-hold="right">▶</button>
  </div>
  <div class="actions">
    <button data-action="block">BLOCK</button>
    <button data-action="dash">DASH</button>
    <button class="attack" data-action="attack">M1</button>
    <button class="tech locked" id="techBtn" data-action="tech">CT LOCKED</button>
    <button class="swap" id="techSwapBtn" data-action="techswap">CT 1</button>
    <button class="domain" id="domainBtn" data-action="domain">DOMAIN</button>
    <button class="char" id="charBtn" data-action="char">CHAR</button>
  </div>
</div>

<div id="hint">A/D MOVE · W JUMP · J M1 · K TECH · I NEXT CT · U DOMAIN · SHIFT DASH · L BLOCK · C CHARACTER</div>
</div>
<script src="game.js"></script>
</body>
</html>
